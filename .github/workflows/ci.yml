name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }} / Vue ${{ matrix.vue }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
        vue: ['3.5.0', '3.5.25', '3.5.26', 'latest']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Pin Vue ${{ matrix.vue }}
        if: matrix.vue != 'latest'
        run: pnpm add -D vue@${{ matrix.vue }} @vue/server-renderer@${{ matrix.vue }}

      - name: Pin Vue latest
        if: matrix.vue == 'latest'
        run: pnpm add -D vue@latest @vue/server-renderer@latest

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
